# Largest candidate in the historical first-order capacity sweep (28 GiB budget).
# Full FP32 weights/gradients/AdamW states, BF16 activations, no offload/quantization.
# 1,583,879,748 parameters; old first-order meta measured 27.96 GiB reserved.
# Remeasure exact meta with FP32 dynamic states before using stage=meta.
hardware:
  device: cuda
  precision: bfloat16
  tf32_matmul: true
  torch_compile: false
  vram_limit_gb: 28.0

model:
  name: uTTT-1.584B
  vocab_size: 32000
  d_model: 2560
  n_layers: 34
  n_heads: 20
  n_kv_heads: 5
  d_ff_fast: 6912
  sliding_window_size: 512
  max_seq_len: 4096
  rope_theta: 10000.0
  rms_norm_eps: 1.0e-5
  dropout: 0.0
  repetition_penalty: 1.0

uttt:
  chunk_size: 128
  base_inner_lr: 0.015
  base_weight_decay: 0.005
  momentum_beta: 0.9
  max_inner_grad_norm: 1.0
  normalize_loss_by_dim: true
  surprise_threshold: 0.015
  elastic_anchor_lambda: 0.02
  max_weight_drift_ratio: 0.35

training:
  stage: pretrain
  tokenizer_path: data/tokenizer.json
  seed: 42
  micro_batch_size: 1
  grad_accum_steps: 32
  seq_len: 1024
  max_steps: 100000
  warmup_steps: 1000
  outer_lr: 2.0e-4
  meta_fast_lr: 1.0e-4
  weight_decay: 0.1
  max_outer_grad_norm: 1.0
  surprise_aux_loss_weight: 0.0
  gradient_checkpointing: true
  pack_sequences: true
  validation_fraction: 0.02
  eval_interval: 500
  eval_samples: 64
  log_interval: 10
  save_interval: 1000
  base_checkpoint_path: checkpoints/uttt_1.584b_pretrain.pt

personalization:
  personas_dir: personas
  max_gpu_users: 2
  max_cpu_users: 8
  auto_save_every_turn: true
  default_max_new_tokens: 128
  temperature: 0.3
  top_p: 0.9
