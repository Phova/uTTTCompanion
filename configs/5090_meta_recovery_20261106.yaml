# Exact, memory-only meta adaptation after SFT passes its heldout gate.
# The 1.584B model is retained; 944,727,108 memory parameters are trainable.
hardware:
  device: cuda
  precision: bfloat16
  tf32_matmul: true
  torch_compile: false
  vram_limit_gb: 28.0
  enforce_vram_limit: true
  cuda_allocator_conf: expandable_segments:True

model:
  name: uTTT-1.584B-Meta-Recovery
  vocab_size: 32000
  d_model: 2560
  n_layers: 34
  n_heads: 20
  n_kv_heads: 5
  d_ff_fast: 6912
  sliding_window_size: 512
  max_seq_len: 4096
  rope_theta: 10000.0
  rms_norm_eps: 1.0e-5
  dropout: 0.0
  repetition_penalty: 1.0

uttt:
  chunk_size: 128
  base_inner_lr: 0.015
  base_weight_decay: 0.005
  momentum_beta: 0.9
  max_inner_grad_norm: 1.0
  normalize_loss_by_dim: true
  surprise_threshold: 0.015
  elastic_anchor_lambda: 0.02
  max_weight_drift_ratio: 0.35

training:
  stage: meta
  parameter_scope: memory
  expected_inner_loop_protocol: chunk_shared_fp32_exact_v2
  tokenizer_path: data/pretrain_20261029/tokenized/tokenizer.json
  seed: 20261106
  micro_batch_size: 1
  grad_accum_steps: 1
  seq_len: 768
  max_steps: 500
  warmup_steps: 50
  outer_lr: 1.0e-5
  meta_fast_lr: 1.0e-6
  weight_decay: 0.1
  max_outer_grad_norm: 1.0
  surprise_aux_loss_weight: 0.0
  gradient_checkpointing: true
  gradient_checkpointing_every: 1
  meta_checkpoint_layers: 4
  meta_checkpoint_time_chunks: true
  meta_checkpoint_reentrant: true
  autocast_cache_across_accumulation: false
  pack_sequences: false
  validation_fraction: 0.05
  eval_interval: 50
  eval_samples: 32
  log_interval: 10
  save_interval: 100
  base_checkpoint_path: checkpoints/uttt_1.584b_20261106_meta.pt
